name: Web E2E
on:
  pull_request:
    paths: ['apps/api/**', 'apps/web/**', 'packages/shared/**', 'emulator/profiles/**', 'package*.json', '.github/workflows/web-e2e.yml']
  push:
    branches: [master, main, pokerace-client]
    paths: ['apps/api/**', 'apps/web/**', 'packages/shared/**', 'emulator/profiles/**', 'package*.json', '.github/workflows/web-e2e.yml']
  workflow_dispatch:
  # Also run by release.yml before any launcher is built (blocking checks); `ref` = the tag being released.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

# A newer push on the same branch cancels the run it supersedes (Actions minutes are billed).
concurrency:
  group: web-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  playwright:
    # Real browser + built Web + real API/SQLite/Socket.IO + Fake Game Client. No ROM, no BizHawk.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Playwright starts the API and `vite preview` on free ports and stops them even on failure.
      - run: npm run test:e2e -w @pokerace/web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-failure
          path: |
            apps/web/e2e-results
            apps/web/e2e-report
