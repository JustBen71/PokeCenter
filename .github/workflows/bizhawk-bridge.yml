name: BizHawk bridge
on:
  pull_request:
    paths: ['bridges/bizhawk/**', 'native/Pokerace.Client/**', 'pokerace.cmd', 'apps/api/**', 'packages/shared/**', 'emulator/profiles/**', 'package*.json', '.github/workflows/bizhawk-bridge.yml']
  push:
    branches: [master, main, 'bizhawk-bridge', 'pokerace-client']
    paths: ['bridges/bizhawk/**', 'native/Pokerace.Client/**', 'pokerace.cmd', 'apps/api/**', 'packages/shared/**', 'emulator/profiles/**', 'package*.json', '.github/workflows/bizhawk-bridge.yml']
    tags: ['bizhawk-bridge-*']
  workflow_dispatch:
  # Also run by release.yml before any launcher is built (blocking checks); `ref` = the tag being released.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

# A newer push on the same branch cancels the run it supersedes (Actions minutes are billed).
concurrency:
  group: bizhawk-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  unit-and-integration:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download and verify pinned BizHawk assemblies
        shell: pwsh
        run: ./bridges/bizhawk/e2e/prepare-bizhawk.ps1
      - run: dotnet restore bridges/bizhawk/Pokerace.BizHawkBridge.sln
      - run: dotnet build bridges/bizhawk/Pokerace.BizHawkBridge.sln --configuration Release --no-restore
      - run: dotnet test bridges/bizhawk/Pokerace.BizHawkBridge.sln --configuration Release --no-build --logger "trx;LogFileName=bridge-tests.trx" --results-directory bridges/bizhawk/artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-unit-results
          path: bridges/bizhawk/artifacts/tests

  e2e-bizhawk:
    needs: unit-and-integration
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real BizHawk, real bridge, original homebrew ROM
        shell: pwsh
        run: ./bridges/bizhawk/e2e/run-e2e.ps1 -ClientE2E
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-e2e-results
          path: bridges/bizhawk/artifacts/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: pokerace-launcher-win-x64
          path: native/Pokerace.Client/artifacts/launcher-win-x64/Pokerace.Client.exe
